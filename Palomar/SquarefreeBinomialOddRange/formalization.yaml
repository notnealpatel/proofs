    No authoritative human formalization-author identity is available;
    project.authors is therefore empty.
  - >-
    No responsible human maintainer has been identified or authorized;
    project.responsible_maintainers is therefore empty.
  - "USER mathematical, attribution, and source-fidelity review remains pending."
  - >-
    Comparator was not run: comparator, landrun, lean4export, nanoda, and
    nanoda_bin are unavailable in PATH. No verifier installation or toolchain
    change was attempted. enable_nanoda remains true in the configuration.

acknowledgements: >-
  Lean 4 and Mathlib supply the standard arithmetic and p-adic infrastructure.
  T. D. Noe is credited for the source's finite computation comment. The
  repository's prior Kummer, halving, and binary-digit infrastructure is
  reused. These acknowledgements do not assert endorsement or review.
