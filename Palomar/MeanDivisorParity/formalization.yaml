fidelity:
  divergences: >-
    The arithmetic-mean requirement is expressed multiplicatively as
    S.sum id = m*S.card to avoid totalized Nat division. Nonemptiness makes m
    the genuine unique mean. Elements of S range over every integer from 1 to
    n; only m is constrained to divide n. Putnam 2002 A3 allows every integer
    mean, whereas this package adapts the same toggle to divisor-restricted
    means and sums the odd contributions. The square theorem explicitly
    assumes n != 0 because Nat.divisors uses a separate zero convention.

