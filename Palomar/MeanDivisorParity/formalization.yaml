status:
  scope: >-
    Challenge and Solution independently define IsMeanDiv, meanDivSubsets, and
    a. Each counted S is a nonempty Finset subset of Finset.Icc 1 n and has a
    witness m with S.sum id = m*S.card and m | n. This is not a count of subsets
    of n.divisors. The selected results are the modulo-two divisor-count
    congruence, the nonzero square criterion, and the inexpensive existing
    prime characterization. The convention a 0 = 0 is checked separately.
  sorry_count: 3
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.MeanDivisorParity.a_modEq_card_divisors"
      file: "Palomar/MeanDivisorParity/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/MeanDivisorParity/comparator.json"
      literature_dependencies:
        - "Putnam 2002 A3 mean-toggle argument"
      note: >-
        For every natural n, a n and n.divisors.card have equal residues
        modulo two.
    - declaration: "Palomar.MeanDivisorParity.odd_a_iff_isSquare"
      file: "Palomar/MeanDivisorParity/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/MeanDivisorParity/comparator.json"
      literature_dependencies:
        - "Putnam 2002 A3 mean-toggle argument"
      note: >-
        Requires n != 0. The zero convention is a 0 = 0 and is not folded into
        the positive divisor-count/square statement.
    - declaration: "Palomar.MeanDivisorParity.a_eq_two_iff_prime"
      file: "Palomar/MeanDivisorParity/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/MeanDivisorParity/comparator.json"
      literature_dependencies: []
      note: "The literal count equals two exactly when n is prime."

