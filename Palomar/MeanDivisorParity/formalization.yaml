version: "v0.4"

project:
  name: "Parity of subsets whose integer mean divides n"
  description: >-
    A Lean 4 formalization of the literal finite count of nonempty subsets of
    {1, ..., n} whose arithmetic mean is an integer m dividing n. It proves
    that this count is congruent modulo two to the number of divisors of n and,
    for n != 0, is odd exactly when n is a perfect square. It also packages the
    focused prime characterization that the count equals two exactly at primes.
  # Required human identities are unknown. Empty lists expose the metadata
  # blocker rather than inventing an author or maintainer.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "The William Lowell Putnam Mathematical Competition 2002: solutions"
    authors:
      - "Kiran S. Kedlaya"
      - "Lenny Ng"
    id: "https://kskedlaya.org/putnam-archive/2002s.pdf"
    type: "problem-solutions"
    location: "Problem A3 and its mean-toggle parity solution"
    relationship: "adapts-technique-from"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      Putnam 2002 A3 treats all nonempty subsets of {1, ..., n} having integer
      mean. The present theorem restricts the allowed means to divisors of n
      and partitions the literal subset family by its unique mean. No claim of
      a new involution or priority is made.
  - title: "OEIS A114976"
    authors:
      - "The OEIS Foundation Inc. and contributors to entry A114976"
    id: "https://oeis.org/A114976"
    type: "database-entry"
    location: >-
      Sequence of numbers of subsets of {1, ..., n} whose arithmetic mean is
      an integer divisor of n
    relationship: "formalizes"
    license: "OEIS End-User License Agreement"
    author_endorsement: "not-contacted"
    note: >-
      The package formalizes the sequence definition and the parity/square and
      prime patterns proved in the existing repository development. No broad
      literature or priority search was undertaken during packaging.

related_formalizations: []

