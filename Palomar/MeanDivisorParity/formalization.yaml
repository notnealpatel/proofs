  statements:
    - source: >-
        The number a(n) of nonempty subsets of {1, ..., n} with integer mean
        dividing n has the same parity as the number of divisors of n
      lean: "Palomar.MeanDivisorParity.a_modEq_card_divisors"
      module: "Palomar.MeanDivisorParity.Solution"
      status: "proved"
      note: "Stated as Nat.ModEq 2 (a n) n.divisors.card."
    - source: "For nonzero n, a(n) is odd if and only if n is a square"
      lean: "Palomar.MeanDivisorParity.odd_a_iff_isSquare"
      module: "Palomar.MeanDivisorParity.Solution"
      status: "proved"
      note: "The n != 0 guard is material; a 0 = 0 is separately checked."
    - source: "The count a(n) equals two if and only if n is prime"
      lean: "Palomar.MeanDivisorParity.a_eq_two_iff_prime"
      module: "Palomar.MeanDivisorParity.Solution"
      status: "proved"
      note: "Included as a focused existing corollary."

