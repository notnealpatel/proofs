fidelity:
  divergences: >-
    The formalized statistic is precisely least spanning-row rank in the
    Boolean semiring: a generating family must be a subset of the matrix's
    existing rows and spans are finite coordinatewise-OR sums, including the
    empty sum. It is not Schein/rectangle-cover factorization rank and not
    linear rank over F2. The probability is the finite uniform counting
    fraction over all 2^(n*n) square Boolean matrices. No divergence from this
    interpretation is known. Attribution, literature priority, and novelty
    remain unestablished and have not been independently human-reviewed.

