version: "v0.4"

project:
  name: "Almost every Boolean matrix has full Boolean row rank"
  description: >-
    A Lean 4 formalization that the fraction of uniformly counted square
    matrices over the two-element Boolean semiring having full Boolean row
    rank tends to one. Boolean row rank is the least number of existing rows
    generating the same coordinatewise-OR span as all rows. The package also
    selects the explicit bounds 1 - n^2(3/4)^n <= fraction <= 1 for n >= 2.
  # Required human identities are unknown. Empty lists expose the metadata
  # blocker rather than inventing an author or maintainer.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "OEIS A354741: Number of n X k matrices with Boolean rank k"
    authors:
      - "OEIS Foundation Inc. and contributors to entry A354741"
    id: "https://oeis.org/A354741"
    type: "database-entry"
    location: >-
      Entry A354741 and its comment conjecturing that the proportion on the
      square diagonal tends to one
    relationship: "formalizes-stated-conjecture"
    license: "OEIS End-User License Agreement"
    author_endorsement: "not-contacted"
    note: >-
      The exact attribution and global priority of the asymptotic statement
      have not been established. This package does not claim novelty,
      endorsement, or source-author review.

related_formalizations: []

