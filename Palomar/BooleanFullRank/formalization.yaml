alignment:
  namespace: "Palomar.BooleanFullRank"
  statements:
    - source: >-
        For n >= 2, at least 1 - n^2(3/4)^n of square Boolean matrices
        have full Boolean row rank, and the fraction is at most one
      lean: "Palomar.BooleanFullRank.one_sub_le_fullRowRankFraction"
      module: "Palomar.BooleanFullRank.Solution"
      status: "proved"
      note: >-
        Uses the package's literal count/minimization definitions; the upper
        half is separately selected as fullRowRankFraction_le_one.
    - source: "A finite counting fraction is at most one"
      lean: "Palomar.BooleanFullRank.fullRowRankFraction_le_one"
      module: "Palomar.BooleanFullRank.Solution"
      status: "proved"
      note: "Selected to provide the complete quantitative sandwich."
    - source: >-
        The square-diagonal full Boolean-row-rank fraction tends to one
      lean: "Palomar.BooleanFullRank.fullRowRankFraction_tendsto_one"
      module: "Palomar.BooleanFullRank.Solution"
      status: "proved"
      note: >-
        Tendence is along natural n at Filter.atTop. The denominator is
        explicitly 2^(n*n), hence never zero.

