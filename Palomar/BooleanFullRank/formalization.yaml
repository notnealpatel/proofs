status:
  scope: >-
    The selected declarations are the asymptotic theorem, its union-bound
    lower estimate for n >= 2, and the universal upper estimate. Challenge
    and Solution independently define the Boolean semiring, square-matrix
    count, coordinatewise-OR row span, least spanning-row rank, and resulting
    fraction. Solution transparently bridges those literal declarations to
    Proofs/BilinearComplexity/BooleanRankGeneric.lean. Rectangle-cover
    factorization rank, rank over F2, computations of table entries, and
    unrelated random-matrix models are outside scope.
  sorry_count: 3
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.BooleanFullRank.one_sub_le_fullRowRankFraction"
      file: "Palomar/BooleanFullRank/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/BooleanFullRank/comparator.json"
      literature_dependencies: []
      note: >-
        For 2 <= n, proves 1 - n^2(3/4)^n <= fullRowRankFraction n.
    - declaration: "Palomar.BooleanFullRank.fullRowRankFraction_le_one"
      file: "Palomar/BooleanFullRank/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/BooleanFullRank/comparator.json"
      literature_dependencies: []
      note: "Proves fullRowRankFraction n <= 1 for every n."
    - declaration: "Palomar.BooleanFullRank.fullRowRankFraction_tendsto_one"
      file: "Palomar/BooleanFullRank/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/BooleanFullRank/comparator.json"
      literature_dependencies: []
      note: >-
        Proves Tendsto fullRowRankFraction atTop (nhds 1). Fresh declaration
        auditing found no sorryAx, native_decide, Lean.ofReduceBool, or custom
        axiom dependency in the selected closure.

