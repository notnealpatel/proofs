status:
  scope: >-
    Challenge and Solution independently define binToTernary, the exceptional
    three-term-progression predicate, finite greedy prefixes, and greedySeq.
    The recursion starts from the singleton {1}; the allowed progression makes
    2 and 3 arise from the greedy rule rather than inserting the whole seed.
    The sole selected result is the pointwise closed form for index m + 2.
    Solution proves equality with the existing repository recursion before
    applying _root_.A092482.greedySeq_add_two.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.A092482.greedySeq_add_two"
      file: "Palomar/A092482/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/A092482/comparator.json"
      literature_dependencies: []
      note: >-
        For every natural m, greedySeq (m + 2) equals
        1 + 2 ^ Nat.log 2 (m + 1) + binToTernary (m + 1). The only package
        sorry is the intentional matching theorem hole in Challenge.lean,
        which v0.4 excludes from sorry_count; the selected Solution declaration
        has no sorryAx dependency.

