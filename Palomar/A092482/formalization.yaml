fidelity:
  divergences: >-
    The package is zero-indexed: greedySeq r represents OEIS a(r+1), and
    binToTernary begins 0, 1, 3, 4 rather than adopting the OEIS display
    offset. Consequently the theorem uses m + 1 in both Nat.log and
    binToTernary. The summation typo in the OEIS display is documented but is
    not part of the selected theorem. The legality predicate permits only the
    strictly ordered progression (1, 2, 3), and the recursion derives that
    seed from {1}. A092482 is not identified with the differently seeded rows
    of A093682 or with an ordinary Stanley sequence.

