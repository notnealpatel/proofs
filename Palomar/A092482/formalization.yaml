version: "v0.4"

project:
  name: "OEIS A092482 greedy sequence with exceptional initial progression"
  description: >-
    A Lean 4 package for the zero-indexed increasing greedy sequence beginning
    at 1 that permits the initial arithmetic progression (1, 2, 3) and no
    other strictly ordered three-term arithmetic progression. It proves the
    OEIS A092482 closed form using the binary expansion read in base three.
  # Required human identities have not been established. Empty lists expose
  # the blocker rather than inventing an author or responsible maintainer.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "OEIS A092482 — sequence with no three-term arithmetic progression beyond 1, 2, 3"
    authors:
      - "Jean-François Alcover (formula/comment contributor)"
      - "The OEIS Foundation Inc. and contributors to entry A092482"
    id: "https://oeis.org/A092482"
    type: "database-entry"
    location: >-
      Sequence definition and the 2019-01-15 formula/comment attributed to
      Jean-François Alcover, as represented in the pinned 2026-08-05 source
      snapshot
    relationship: "formalizes"
    license: "OEIS End-User License Agreement"
    author_endorsement: "not-contacted"
    note: >-
      The pinned 2026-08-05 source snapshot labeled the closed form
      conjectured and checked through n = 512. This package proves its
      corrected zero-offset interpretation. The historical display had the
      bound-variable occurrence recorded as n where the summand requires k,
      and A005836 is read here from offset zero. The OEIS record was
      subsequently updated to state that the conjecture is correct and to
      link Neal Patel's proof note; this package makes no independent claim
      about current proof status, novelty, or priority.

