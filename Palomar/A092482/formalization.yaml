alignment:
  namespace: "Palomar.A092482"
  statements:
    - source: >-
        For n >= 1, the A092482 term a(n+2) equals one plus
        2^floor(log base 2 of n) plus the binary digits of n read in base three.
      lean: "Palomar.A092482.greedySeq_add_two"
      module: "Palomar.A092482.Solution"
      status: "proved"
      note: >-
        With n = m + 1 and zero-indexed greedySeq, Lean states that
        greedySeq (m + 2) is
        1 + 2 ^ Nat.log 2 (m + 1) + binToTernary (m + 1).

