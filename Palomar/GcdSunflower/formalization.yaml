version: "v0.4"

project:
  name: "Gcd sunflower bound on an almost-prime layer"
  description: >-
    A Lean 4 packaging of the classical Erdős reduction from finite families
    of natural numbers with constant multiplicity-counted Omega to uniform
    sunflower families. If r >= 2, every a in A is nonzero with Omega(a) = k,
    and no r-element subset has one common pairwise gcd, then
    card(A) <= (r-1)^k * k!. This is only the exact almost-prime layer bound;
    it neither estimates f_r(N) nor proves the open c_r^k strengthening.
  # Required human identities were not available. Empty lists expose the
  # blocker rather than inventing an author or maintainer.
  authors: []
  responsible_maintainers: []
  license: "MIT"

