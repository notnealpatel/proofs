fidelity:
  divergences: >-
    EqualPairwiseGcd quantifies over two pairs (a,b) and (c,d), requiring both
    pairs to consist of distinct members, and equates Nat.gcd a b with
    Nat.gcd c d. GcdPatternFree quantifies over A.powersetCard r, so the r
    elements are distinct. Nat.IsAlmostPrime k a is Mathlib's conjunction
    a != 0 and Omega(a) = k, where Omega counts multiplicity; it is not the
    squarefree distinct-prime count omega. layerSet N a consists of prime
    powers q <= N dividing a, represented in Fin (N+1). This relabels the
    classical (p,j) layers by p^j. The imported result proves the factorial
    Erdős-Rado bound under the stronger prohibition of every equal-gcd tuple;
    it does not prove the corrected coprime-quotient auxiliary conjecture or a
    c_r^k estimate.

