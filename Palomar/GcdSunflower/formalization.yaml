alignment:
  namespace: "Palomar.GcdSunflower"
  statements:
    - source: "All two pairs of distinct members of S have the same gcd"
      lean: "Palomar.GcdSunflower.EqualPairwiseGcd"
      module: "Palomar.GcdSunflower.Solution"
      status: "defined"
      note: "The pair-of-pairs quantifiers are literal in both package modules."
    - source: "No r distinct members of A have equal pairwise gcd"
      lean: "Palomar.GcdSunflower.GcdPatternFree"
      module: "Palomar.GcdSunflower.Solution"
      status: "defined"
      note: "Distinctness is supplied by Finset.powersetCard r."
    - source: "Prime-power divisor layer encoding truncated at N"
      lean: "Palomar.GcdSunflower.layerSet"
      module: "Palomar.GcdSunflower.Solution"
      status: "defined"
      note: "It contains prime powers q in Fin (N+1) that divide a."
    - source: >-
        Classical almost-prime layer reduction to the Erdős-Rado sunflower
        bound
      lean: "Palomar.GcdSunflower.card_le_of_isAlmostPrime"
      module: "Palomar.GcdSunflower.Solution"
      status: "proved"
      note: >-
        For 2 <= r and uniform multiplicity-counted Omega k, pattern-freeness
        implies A.card <= (r-1)^k*k!.

