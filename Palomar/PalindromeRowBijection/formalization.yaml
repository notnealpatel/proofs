status:
  scope: >-
    Challenge and Solution independently define subsetCount n k as the number
    of k-element subsets of Finset.range n whose shifted sum by i |-> i + 1 is
    divisible by n. The sole selected result states symmetry at n = 2^j under
    the material strict bounds 0 < k and k < 2^j. It does not claim endpoint
    symmetry, the odd-row theorem, or a full-row palindrome. At j = 0 the
    hypotheses are jointly impossible.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
