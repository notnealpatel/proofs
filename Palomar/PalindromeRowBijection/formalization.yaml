alignment:
  namespace: "PalindromeRowBijection"
  statements:
    - source: >-
        The truncated A267632 row is a palindrome when its row length is a
        power of two
      lean: "PalindromeRowBijection.subsetCount_two_pow_symm"
      module: "Palomar.PalindromeRowBijection.Solution"
      status: "proved"
      note: >-
        For natural j and k with 0 < k < 2^j, both package modules state
        subsetCount (2^j) k = subsetCount (2^j) (2^j - k) with the same
        repeated definition and theorem header. The Solution unfolds the
        definition and applies the explicit repository bijection.

