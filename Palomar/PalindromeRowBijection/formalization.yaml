    id: "https://oeis.org/A267632"
    type: "database-entry"
    location: >-
      Definition of the triangle and the observation-conjecture that deleting
      the final term gives a palindrome when n is odd or a power of two
    relationship: "formalizes"
    license: "OEIS End-User License Agreement"
    author_endorsement: "not-contacted"
    note: >-
      The power-of-two observation is unattributed in the repository's pinned
