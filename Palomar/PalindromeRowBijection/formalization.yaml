version: "v0.4"

project:
  name: "Palindromic power-of-two subset-count rows"
  description: >-
    A Lean 4 package proving that the strict interior of each power-of-two row
    of the subset-counting triangle OEIS A267632 is symmetric. The count uses
    k-element subsets of {1, ..., 2^j} whose ordinary label sum is divisible
    by 2^j. The proof reuses an explicit complement-and-translation bijection.
  # Authoritative human identities are unknown. Empty lists expose the
  # metadata blockers rather than inventing an author or maintainer.
  authors: []
  responsible_maintainers: []
  license: "MIT"

