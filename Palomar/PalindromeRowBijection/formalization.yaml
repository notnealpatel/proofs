fidelity:
  divergences: >-
    Finset.range n represents the labels {1, ..., n} through i |-> i + 1, so
    divisibility is imposed on the ordinary shifted label sum rather than the
    unshifted residue sum. The strict bounds exclude both endpoints, where a
    positive-exponent power-of-two row has subsetCount n n = 0 but
    subsetCount n 0 = 1. The statement uses 0 < k, definitionally equivalent
    to the repository bridge theorem's lower-bound hypothesis, and natural
    subtraction n - k. The j = 0 case is vacuous rather than an endpoint claim.

