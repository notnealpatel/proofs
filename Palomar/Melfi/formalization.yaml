fidelity:
  divergences: >-
    The formal statement matches the published positive-even natural-number
    claim. Practical numbers are represented by positivity plus representability
    of every m ≤ n as a sum over a finite subset of n's positive divisors. The
    Lean development uses an elementary covering by practical families based on
    powers of two and twice powers of three, not Melfi's twin-practical-sequence
    construction. The detailed source proof was not independently read, so this
    proof-route description has not been source-verified by a human.

review:
  status: "unchecked"
  reviewers: []
  notes: >-
    USER review is the sole review gate and is still pending. Automated Lean
    elaboration and axiom auditing are recorded in verification.md; they do not
    constitute human mathematical, attribution, or source-fidelity review.

alignment:
  namespace: "Palomar.Melfi"
  statements:
    - source: >-
        Melfi's theorem that every positive even integer is the sum of two
        practical numbers
      lean: "Palomar.Melfi.even_eq_practical_add_practical"
      module: "Palomar.Melfi.Solution"
      status: "proved"
      note: >-
        The theorem requires Even n and 0 < n and returns practical q and r
        with q + r = n. The positivity hypothesis excludes the degenerate even
        value zero.

