fidelity:
  divergences: >-
    The formal statement matches the published positive-even natural-number
    claim. Practical numbers are represented by positivity plus representability
    of every m ≤ n as a sum over a finite subset of n's positive divisors. The
    Lean development uses an elementary covering by practical families based on
    powers of two and twice powers of three, not Melfi's twin-practical-sequence
    construction. The survey comparison was checked against printed pp. 349–351;
    the cited 1996 subsidiary arguments were not independently re-read. This is
    a route comparison, not a claim of independence, novelty, or priority.

