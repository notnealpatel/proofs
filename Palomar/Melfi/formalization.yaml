version: "v0.4"

project:
  name: "Every positive even number is a sum of two practical numbers"
  description: >-
    A Lean 4 formalization of Melfi's practical-number analogue of Goldbach's
    conjecture: every positive even natural number is the sum of two practical
    numbers. Practicality is stated using finite subsets of the positive
    divisors, so the summands are distinct divisors. The checked Lean proof uses
    an elementary covering argument rather than claiming to reproduce Melfi's
    published proof route.
  # Required human identities have not yet been established. These empty lists
  # deliberately expose the submission blocker instead of inventing attribution.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "On Two Conjectures about Practical Numbers"
    authors:
      - "Giuseppe Melfi"
    id: "https://doi.org/10.1006/jnth.1996.0012"
    type: "paper"
    location: "Journal of Number Theory 56 (1996), 205–210; positive-even sum theorem"
    relationship: "independently-proves"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      This formalization proves the published result by an alternative
      two-family covering argument. The detailed proof in the source and the
      comparison of proof routes have not been independently human-reviewed.

related_formalizations: []

classification:
  arxiv:
    - "math.NT"
  msc2020:
    - "11A25"

