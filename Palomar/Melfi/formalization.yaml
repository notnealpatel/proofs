version: "v0.4"

project:
  name: "Every positive even number is a sum of two practical numbers"
  description: >-
    A Lean 4 formalization of Melfi's practical-number analogue of Goldbach's
    conjecture: every positive even natural number is the sum of two practical
    numbers. Practicality is stated using finite subsets of the positive
    divisors, so the summands are distinct divisors. The checked Lean proof uses
    an elementary covering argument rather than claiming to reproduce Melfi's
    published proof route.
  # Required human identities have not yet been established. These empty lists
  # deliberately expose the submission blocker instead of inventing attribution.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "A survey on practical numbers"
    authors:
      - "Giuseppe Melfi"
    id: "https://seminariomatematico.polito.it/rendiconti/cartaceo/53-4/347.pdf"
    type: "survey"
    location: "Rend. Sem. Mat. Univ. Pol. Torino 53 (1995), 347–359; read printed pp. 349–351 (Proposition 3, Lemma 4, Lemma 5, Theorem 6)"
    relationship: "states-and-contextualizes"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      This public survey was actually read for the source gate. It states
      Theorem 6 and supplies the source-checked twin-practical route comparison.
      Its references to [8, Lemma 2] and [8, Theorem 1] identify subsidiary
      arguments not independently re-read here.

  - title: "On Two Conjectures about Practical Numbers"
    authors:
      - "Giuseppe Melfi"
    id: "https://doi.org/10.1006/jnth.1996.0012"
    type: "paper"
    location: "Journal of Number Theory 56 (1996), 205–210; positive-even sum theorem"
    relationship: "independently-proves"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The formalization proves the published result by an alternative
      two-family covering argument. The 1996 paper itself was not independently
      read here; the 1995 survey was read on printed pp. 349–351 and supports a
      bounded comparison of the routes. Human source-fidelity review remains
      pending.

