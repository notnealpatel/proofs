alignment:
  namespace: "Palomar.Melfi"
  statements:
    - source: >-
        Melfi's theorem that every positive even integer is the sum of two
        practical numbers
      lean: "Palomar.Melfi.even_eq_practical_add_practical"
      module: "Palomar.Melfi.Solution"
      status: "proved"
      note: >-
        The theorem requires Even n and 0 < n and returns practical q and r
        with q + r = n. The positivity hypothesis excludes the degenerate even
        value zero.

