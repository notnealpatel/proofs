  scope: >-
    The package selects the single headline that every positive even natural
    number is a sum of two practical numbers. It includes its ordinary
    practical-number definition in separate Challenge and Solution modules and
    uses the repository's substantive proof in
    Proofs/Enumerative/MelfiPracticalSum.lean. Supporting lemmas are not
    advertised as separate results.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.Melfi.even_eq_practical_add_practical"
      file: "Palomar/Melfi/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/Melfi/comparator.json"
      literature_dependencies: []
      note: >-
        The project-wide sorry count records an unrelated archived Coleman
        theorem in Proofs/Enumerative/Practical.lean. A fresh axiom audit shows
        that neither this result nor its source declaration depends on sorryAx.

