fidelity:
  divergences: >-
    The independent predicate is definitionally identical to the source
    predicate: all edges have cardinality r, every pair including the diagonal
    is non-disjoint, and every finite set of cardinality less than r misses an
    edge. Edge counts range over all Fin N and g(r) is their Nat.sInf. The
    positive hypothesis is material: it provides a nonempty index and actual
    attained minimum and keeps 2*r-1 away from the r=0 truncation issue. At r=0
    the empty family honestly realizes g(0)=0. The prose calls the no-small-cover
    condition transversal number r; for positive r, uniformity and intersection
    make each edge a transversal and the last clause excludes every smaller
    one. The selected result is weaker than published large-r lower bounds and
    carries no new-mathematics, significance, or priority claim.

