version: "v0.4"

project:
  name: "The elementary pair-cover lower bound for the Erdős–Lovász number"
  description: >-
    A Lean 4 formalization of the elementary bound 2r - 1 <= g(r) for every
    positive integer r, where g(r) is the minimum number of edges in an
    r-uniform intersecting finite hypergraph with transversal number r. The
    independent statement ranges over all finite labelled ground types and
    proves that its natural-infimum index is nonempty and attained for every
    positive r. The proof pairs edges, choosing one common vertex per pair and
    one vertex for a possible unpaired edge. This is the exact elementary
    prior-art argument recorded in Bushaw–Danielsson–Hurlbert, Fact 17, and is
    weaker in the large-r regime than published bounds; no novelty or priority
    is claimed.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "Erdős-Ko-Rado Theorems for Paths in Graphs"
    authors:
      - "Neal Bushaw"
      - "James Danielsson"
      - "Glenn Hurlbert"
    id: "https://arxiv.org/abs/2504.05406v1"
    type: "paper"
    location: "§3.1, Fact 17 (7 April 2025; TeX label f:basicUpperBound)"
    relationship: "independently-proves"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      Fact 17 states that every intersecting family F has transversal number
      tau(F) <= ceil(|F|/2), and proves it by pairing the sets, choosing one
      common element from each pair, and choosing one element from a possible
      unpaired set. For tau(F)=r this gives 2r-1 <= |F|, exactly the selected
      structural mechanism and elementary family-level implication. This
      source was located after the recorded Lean proof construction; the Lean
      proof does not import or assume Fact 17. That chronology is not a claim
      of retrieval-blind discovery, global novelty, or priority.
  - title: "Problems and results on 3-chromatic hypergraphs and some related questions"
    authors:
      - "Paul Erdős"
      - "László Lovász"
    id: "P. Erdős and L. Lovász, Infinite and Finite Sets, Colloq. Math. Soc. János Bolyai 10 (1975), 609–627"
    type: "paper"
    location: "the Erdős–Lovász cover-number problem and the bound g(r) >= 8r/3 - 3"
    relationship: "background"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      This paper supplies the historical Erdős–Lovász invariant and its
      stronger 8r/3 - 3 lower bound. It is background rather than the source of
      the selected pair-cover proof. The selected Lean theorem states only
      2r - 1 <= g(r), and no novelty or priority claim is made for it.
  - title: "An Improved Lower Bound for the Erdős–Lovász Cover Number Problem"
    authors:
      - "Venkatesan Sivashankar"
    id: "https://arxiv.org/abs/2606.24878"
    type: "paper"
    location: "abstract, introduction, and Theorem 1"
    relationship: "background"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The primary TeX was freshly retrieved for this packaging task. It defines
      the same g(r), reports the Erdős–Lovász 8r/3 - 3 lower bound, and proves
      3r - 4 for all positive r together with a stronger asymptotic bound. It
      documents that the selected 2r - 1 bound is not a state-of-the-art
      large-r result and is not used by the Lean proof.

