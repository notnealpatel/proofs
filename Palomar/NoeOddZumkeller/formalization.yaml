fidelity:
  divergences: >-
    The package deliberately selects only NoeOddZumkellerForward, not Noe's
    full biconditional. Zumkeller membership includes positivity and a literal
    finite partition of all positive divisors into equal-sum sides. A174865 is
    represented as oddness, strict 2*n < sigma(n), and even sigma(n); it is not
    weakened to the nondeficient inequality 2*n <= sigma(n). Mathlib's
    Nat.Perfect supplies positivity and sigma(n)=2*n. Finite OEIS checks are
    treated only as evidence. No universal converse or odd-perfect
    nonexistence theorem is claimed.

review:
  status: "unchecked"
  reviewers: []
  notes: >-
    USER is the sole review gate and review remains pending. Lean elaboration,
    exact type output, and axiom-closure output are mechanical evidence, not
    human mathematical, attribution, source-fidelity, submission, acceptance,
    publication, or approval review.

alignment:
  namespace: "Palomar.NoeOddZumkeller"
  statements:
    - source: >-
        Every odd Zumkeller number is strictly abundant with even divisor sum
        if and only if no odd perfect number exists.
      lean: "Palomar.NoeOddZumkeller.noeOddZumkellerForward_iff_not_exists_odd_perfect"
      module: "Palomar.NoeOddZumkeller.Solution"
      status: "proved"
      note: >-
        The left side is displayed literally as a forall over n with oddness
        and the positive divisor-partition predicate as hypotheses. The right
        side is displayed literally as not-exists n, Odd n and n.Perfect. The
        theorem asserts an equivalence; it does not establish either open side.

