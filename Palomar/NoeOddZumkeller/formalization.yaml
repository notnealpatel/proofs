version: "v0.4"

project:
  name: "Noe's odd-Zumkeller forward assertion and the odd-perfect obstruction"
  description: >-
    A Lean 4 formalization of the exact obstruction to one direction of T. D.
    Noe's observation about odd Zumkeller numbers. The assertion that every odd
    Zumkeller number is strictly abundant with even divisor sum holds if and
    only if no odd perfect number exists. This equivalence does not prove the
    nonexistence of odd perfect numbers and does not prove Noe's full
    biconditional.
  # Authoritative human package identities were not available. Empty lists
  # expose the metadata blockers rather than inventing names.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "OEIS A083207 — Zumkeller numbers"
    authors:
      - "T. D. Noe (quoted comment author)"
      - "OEIS Foundation Inc. and contributors to entry A083207"
    id: "https://oeis.org/A083207"
    type: "database-entry"
    location: >-
      T. D. Noe comments dated 2010-03-31 and 2010-11-14 concerning odd
      Zumkeller numbers and odd abundant numbers with even abundance
    relationship: "states-finite-computational-evidence"
    license: "OEIS End-User License Agreement"
    author_endorsement: "not-contacted"
    note: >-
      The comments report equality below 10^6 and a later finite converse check
      below 10^8. Those computations are not a universal proof. This package
      makes no novelty, priority, endorsement, or source-author review claim.
  - title: "OEIS A174865 — Odd abundant numbers whose abundance is even"
    authors:
      - "T. D. Noe"
      - "OEIS Foundation Inc. and contributors to entry A174865"
    id: "https://oeis.org/A174865"
    type: "database-entry"
    location: "Sequence definition and Mathematica predicate"
    relationship: "defines-sequence-side"
    license: "OEIS End-User License Agreement"
    author_endorsement: "not-contacted"
    note: >-
      The package uses the equivalent literal condition: odd n, 2*n < sigma(n),
      and even sigma(n). The Zumkeller conjectural comment is on A083207 rather
      than A174865.

related_formalizations: []

classification:
  arxiv:
    - "math.NT"
  msc2020:
    - "11A25"

status:
  scope: >-
    The sole selected result is the equivalence between the universally
    quantified forward implication (odd and Zumkeller implies A174865) and the
    nonexistence of an odd Mathlib Nat.Perfect number. Challenge and Solution
    independently define the positive divisor-partition predicate, strict
    abundance, and the literal A174865 condition. Solution bridges them to
    Proofs/Enumerative/NoeZumkellerOdd.lean through explicit equivalences. The
    full Noe biconditional, its converse, any abundance-implies-Zumkeller
    statement, and any proof that odd perfect numbers do not exist are outside
    scope.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.NoeOddZumkeller.noeOddZumkellerForward_iff_not_exists_odd_perfect"
      file: "Palomar/NoeOddZumkeller/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/NoeOddZumkeller/comparator.json"
      literature_dependencies: []
      note: >-
        The one package sorry is the intentional selected-theorem hole in
        Challenge.lean. Fresh Solution compilation and #print axioms show no
        sorryAx, native_decide, Lean.ofReduceBool, or custom axiom in the
        selected closure.

