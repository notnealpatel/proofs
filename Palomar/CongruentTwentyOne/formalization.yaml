fidelity:
  divergences: >-
    No mathematical divergence: the package expands IsPrimitiveCongruent 21
    as Squarefree (21 : Nat) and existence of positive rational a,b,c with
    a^2+b^2=c^2 and a*b=2*(21 : Rat). The source's IsCongruentNumber and
    IsCongruentArea wrappers are omitted from both package statements, and
    the Solution's change/exact bridge checks definitional equality. The
    witness is proved in the source, not made a theorem hypothesis.

