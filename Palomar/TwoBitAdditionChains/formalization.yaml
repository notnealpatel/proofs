fidelity:
  divergences: >-
    Lists store chains in reverse chronological order. The constructor starts
    at [1] and permits only sums of two earlier members; equal summands and
    repeated values are allowed. chainSteps is the tail length, and l is the
    infimum over actual chains with the requested head. Nonemptiness and
    attainment are proved for every positive target. The source development
    proves that this permissive minimum agrees with the strictly ascending
    convention (NumberComplexity.l_eq_lAsc). At zero there are no chains and
    the natural infimum is totalized to zero; the selected theorem retains
    the guard 0 < k. binaryWeight is n.bitIndices.length in both models.
    The solution proves equality of the independent and source minima rather
    than identifying unrelated inductive types by their printed names.

review:
  status: "unchecked"
  reviewers: []
  notes: >-
    USER mathematical, attribution, and source-fidelity review is pending.
    Mechanical Lean checks are not human review. No parent or agent review,
    external endorsement, submission, or acceptance is claimed.

alignment:
  namespace: "Palomar.TwoBitAdditionChains"
  statements:
    - source: >-
        NumberComplexity.l_two_mul_eq_add_one_of_binaryWeight_le_two:
        for positive k with k.bitIndices.length <= 2, l(2*k) = l(k)+1
      lean: "Palomar.TwoBitAdditionChains.l_two_mul_eq_add_one_of_binaryWeight_le_two"
      module: "Palomar.TwoBitAdditionChains.Solution"
      status: "proved"
      note: >-
        Proofs/NumberComplexity/TwoBitAdditionChain.lean constructs an optimal
        chain of length b+1 for 2^a+2^b when a<b. The source doubling theorem
        combines this with the one-bit case. The package adds only an independent
        model and proved semantic bridge; it does not enlarge that theorem's scope.

