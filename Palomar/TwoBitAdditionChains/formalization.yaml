version: "v0.4"

project:
  name: "Exact doubling for addition chains with at most two binary ones"
  description: >-
    A Lean 4 package for the bounded-family equality l(2*k) = l(k)+1 whenever
    k is positive and has at most two binary ones. The independent challenge
    defines actual addition chains, their lengths in additions, and the minimum
    over chains reaching the target. It does not assume a supplied complexity
    function or a global lower bound.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "OEIS A003313: shortest addition-chain length"
    authors:
      - "The OEIS Foundation Inc. and contributors"
    id: "https://oeis.org/A003313"
    type: "web"
    location: "Sequence definition and the ascending-chain convention"
    relationship: "documents"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      Context inherited from the dated transcriptions in
      Proofs/NumberComplexity/AdditionChain.lean. This packaging phase did not
      conduct a fresh source retrieval or external literature-priority survey.
  - title: "OEIS A000120: binary weight"
    authors:
      - "The OEIS Foundation Inc. and contributors"
    id: "https://oeis.org/A000120"
    type: "web"
    location: "Number of ones in the binary expansion"
    relationship: "documents"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      Context inherited from Proofs/NumberComplexity/KnuthStolarsky.lean.
      The formal definition is exactly Mathlib's n.bitIndices.length.
  - title: "OEIS A230528: Slizkov's doubling-gap question"
    authors:
      - "The OEIS Foundation Inc. and contributors"
    id: "https://oeis.org/A230528"
    type: "web"
    location: "Alexey Slizkov's January 20, 2024 comment, as transcribed in the source"
    relationship: "documents"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      This is context for the weaker inequality l(k) <= l(2*k)+1, not an
      attribution of the selected exact two-bit theorem to that comment.
      The unrestricted question is not solved by this package.

related_formalizations: []

classification:
  arxiv:
    - "math.NT"
  msc2020:
    - "11Y55"

status:
  scope: >-
    Only the exact doubling equality for positive integers of binary weight at
    most two is selected. The independent model is present verbatim in both
    files, with no cross-import. The one intentional package hole is the
    selected Challenge theorem, not a definition. The axiom list below describes
    the proved Solution closure, not the deliberately incomplete Challenge.
    Neither unrestricted Slizkov nor Knuth-Stolarsky is selected or proved.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.TwoBitAdditionChains.l_two_mul_eq_add_one_of_binaryWeight_le_two"
      file: "Palomar/TwoBitAdditionChains/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/TwoBitAdditionChains/comparator.json"
      literature_dependencies:
        - "OEIS A003313 and A000120 supply the documented meanings of l and binary weight"
      note: >-
        The proved bridge identifies the independent chain predicate with
        NumberComplexity.IsAddChain and the sets of attainable lengths with
        those defining NumberComplexity.l. It then applies
        NumberComplexity.l_two_mul_eq_add_one_of_binaryWeight_le_two from
        Proofs/NumberComplexity/SlizkovDoubling.lean, using the helper
        Proofs/NumberComplexity/TwoBitAdditionChain.lean. These source files are
        present at accepted repository revision
        55ab7d253f32b9632581cf31cc4951c2b2119533. Fresh Solution axiom output has no
        sorryAx despite the two separate archived open conjectures in imports.

