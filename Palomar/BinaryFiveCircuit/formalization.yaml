      - "Palomar.BinaryFiveCircuit.Model.BinaryAmbientCarrier.State"
      - "Palomar.BinaryFiveCircuit.Model.BinaryAmbientCarrier.tensorEvaluation"
      - "Palomar.BinaryFiveCircuit.Model.BinaryAmbientCarrier.stateEvaluation"
      - "Palomar.BinaryFiveCircuit.Model.BinaryAmbientMoves.AllModeMove"
      - "Palomar.BinaryFiveCircuit.Model.NormalizedBinaryOrbitClassification.OrbitLabel"
      - "Palomar.BinaryFiveCircuit.Model.BinaryFiveCircuitCompiler.AmbientInOrbit"
      - "Palomar.BinaryFiveCircuit.Model.BinaryFiveCircuitCompiler.AmbientPathFactorSpanConfined"
    model_bridges:
      - "Palomar.BinaryFiveCircuit.Bridge.labelEquiv"
      - "Palomar.BinaryFiveCircuit.Bridge.allModeMove_iff"
      - "Palomar.BinaryFiveCircuit.Bridge.ambientInOrbit_iff_source"
