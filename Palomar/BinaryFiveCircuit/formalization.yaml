version: "v0.4"

project:
  name: "Finite-dimensional ambient classification of binary five-circuits"
  description: >-
    A Lean 4 package for the universal ambient F2 theorem that disjoint
    finite-set states of cardinalities two and three with equal pure-tensor
    evaluation have one unique semantic orbit label and explicit forward and
    reverse intrinsic all-mode paths. Both paths have length at most three,
    altitude at most four, and factor spans confined to those generated by the
    five endpoint terms.
  # Required human identities are unknown. Empty lists expose the blocker
  # rather than attributing AI work to an invented human.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources: []
related_formalizations: []

classification:
  arxiv:
    - "cs.CC"
    - "math.CO"
  msc2020:
    - "15A69"
    - "68Q17"

status:
  scope: >-
    The sole selected result is
    BilinearComplexity.BinaryFiveCircuitTheorem.finiteDimensional_ambient_fiveCircuit_classification,
    repackaged as
    Palomar.BinaryFiveCircuit.finiteDimensional_ambient_fiveCircuit_classification.
    It preserves arbitrary finite-dimensional F2 module ambients, cardinalities
    2 and 3, disjointness, and equal state evaluation. There is no separate
    Circuit premise. The conclusion retains unique semantic OrbitLabel,
    forward and reverse AllModeMove paths, both length and altitude bounds, and
    factor-span confinement to A union B. Thirteen-orbit realization and the
    profile-411 sharpness theorem are deliberately excluded.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.BinaryFiveCircuit.finiteDimensional_ambient_fiveCircuit_classification"
      file: "Palomar/BinaryFiveCircuit/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/BinaryFiveCircuit/comparator.json"
      literature_dependencies: []
      note: >-
        The Solution repeats the independent Challenge model and proves
        Bridge.ambientInOrbit_iff_source under exactly the headline hypotheses.
        The selected theorem uses that equivalence, the explicit label
        equivalence, and path transport preserving vertices and exact metrics.
        Fresh axiom audits of the selected theorem, orbit equivalence, and
        joint-satisfiability theorem report only the three permitted axioms.

  declaration_inventory:
    challenge_model:
      - "Palomar.BinaryFiveCircuit.Model.NormalizedBinaryCarrier.F2"
      - "Palomar.BinaryFiveCircuit.Model.BinaryCircuit.MovePath"
      - "Palomar.BinaryFiveCircuit.Model.BinaryCircuit.MovePath.length"
      - "Palomar.BinaryFiveCircuit.Model.BinaryCircuit.MovePath.vertices"
