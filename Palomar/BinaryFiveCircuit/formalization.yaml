fidelity:
  divergences: >-
    Challenge and Solution repeat the same independent model definitions under
    Palomar.BinaryFiveCircuit.Model. AmbientInOrbit is expressed using exact
    factor-span dimension permutations and the thirteen-row pair-count table.
    Bridge.ambientInOrbit_iff_source proves this characterization equivalent to
    the source's existential exact-span presentation, mode orientation, and
    factorwise-GL action-witness predicate under exactly the selected theorem's
    hypotheses. No equivalence is claimed outside that domain. The forward
    bridge proves invariance under embeddings and normalization; completeness
    uses source orbit existence and proved injectivity of the displayed label
    invariants. The label equivalence is bijective. Move equivalence is proved,
    and path transport preserves every vertex, exact length, exact altitude,
    and factor-span confinement. The headline adds no certificate or Circuit
    premise. The earlier unmatched source-only Solution was not a valid pair;
    it has been replaced, not reclassified as a review issue. No claim is made
    about realization, sharpness, novelty, or an external published theorem.

