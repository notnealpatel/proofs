        with equal state evaluation has one unique semantic orbit label and
        forward/reverse all-mode paths of length at most 3, altitude at most 4,
        factorwise confined to spans generated by A union B.
      lean: "Palomar.BinaryFiveCircuit.finiteDimensional_ambient_fiveCircuit_classification"
