status:
  scope: >-
    The package selects only BCGPU Theorem 3.2, the finite nonabelian Fourier
    barrier. Challenge.lean independently defines the TPP predicate and the
    character-degree invariant using Mathlib's group algebra, isotypic
    components, and module length. Solution.lean repeats those definitions,
    proves their bridge to GroupTPP.CharDegrees, and applies the existing
    theorem GroupTPP.BCGPUBarrier.bcgpu_thm_3_2. It does not package the
    asymptotic omega corollaries or claim a new result.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.TPPFourierBarrier.tpp_card_product_le_fourier_barrier"
      file: "Palomar/TPPFourierBarrier/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/TPPFourierBarrier/comparator.json"
      literature_dependencies:
        - "Blasiak--Church--Cohn--Grochow--Umans, arXiv:2204.03826, Theorem 3.2"
      note: >-
        The package-level sorry is the intentional theorem hole in
        Challenge.lean. A fresh declaration-level audit of the Solution
        theorem reports no sorryAx, native_decide, Lean.ofReduceBool, or
        custom axioms.

