fidelity:
  divergences: >-
    The formal statement matches the paper's finite nonabelian-group theorem.
    Finite subsets are represented as Finset values. The complex character
    degrees are represented canonically by the composition lengths of the
    isotypic components of the regular complex group algebra; the filtered
    minimum uses only degrees d with 1 < d and returns zero if the filtered set
    is empty. The theorem's explicit nonabelianness hypothesis makes the latter
    default irrelevant because the repository bridge proves n(G) >= 2. The
    Solution delegates the analytic Fourier argument to the existing
    source-based GroupTPP theorem rather than duplicating that long proof.

