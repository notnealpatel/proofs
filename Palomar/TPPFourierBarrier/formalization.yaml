version: "v0.4"

project:
  name: "The BCGPU Fourier barrier for triple-product-property triples"
  description: >-
    A Lean 4 packaging of Blasiak--Church--Cohn--Grochow--Umans Theorem 3.2:
    finite subsets S, T, and U with the triple product property in a finite
    nonabelian group G satisfy |S||T||U| <= |G|^(3/2)/sqrt(n(G)) + |G|.
    Here n(G) is defined from the complex character-degree multiset as the
    least irreducible dimension strictly greater than one, so nontrivial
    one-dimensional characters are intentionally excluded.
  # Required human identities have not been established. Empty lists expose
  # the submission blocker rather than inventing attribution.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "Matrix multiplication via matrix groups"
    authors:
