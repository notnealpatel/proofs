      - "Thomas Church"
      - "Henry Cohn"
      - "Joshua A. Grochow"
      - "Chris Umans"
    id: "https://arxiv.org/abs/2204.03826"
    type: "paper"
    location: >-
      Section 3.1, definition of n(G) and Theorem 3.2
      (LaTeX label thm:gowerstrick)
    relationship: "formalizes"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The local primary-paper source was checked at paper.tex lines 164--169.
      It defines n(G) using irreducible dimensions strictly greater than one
      and states the same finite-group inequality. No author endorsement or
      independent human source-fidelity review is claimed.

