alignment:
  namespace: "Palomar.TPPFourierBarrier"
  statements:
    - source: >-
        BCGPU Theorem 3.2: for TPP subsets S, T, U of a finite nonabelian G,
        |S||T||U| <= |G|^(3/2)/n(G)^(1/2) + |G|, with n(G) the minimum
        irreducible dimension strictly greater than one
      lean: "Palomar.TPPFourierBarrier.tpp_card_product_le_fourier_barrier"
      module: "Palomar.TPPFourierBarrier.Solution"
      status: "proved"
      note: >-
        The nonabelian witness is explicit, the TPP is defined by left
        quotients, and the denominator is Real.sqrt of the filtered minimum
        cast to the reals.

