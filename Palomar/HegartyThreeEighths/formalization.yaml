fidelity:
  divergences: >-
    The challenge uses a reversed List prefix, as does the repository source. For
    a prefix of length n, candidate t must be positive, absent from the prefix,
    and satisfy t + a(n-2i) != 2*a(n-i) for every 1 <= i with 2*i <= n. Nat.find
    enforces least selection, and a(n) is the paper's pi_g(n+1). The theorem is
    the paper's 3*N <= 8*pi_g(N) with N=n+1. The substantive counting proof follows
    the repository's documented correction from “same” to “opposite” parity; the
    absent extracted source text prevents upgrading that inherited attribution to
    independently human-checked evidence.

review:
  status: "unchecked"
  reviewers: []
  notes: >-
    USER review is the sole review stage and is pending. Lean elaboration and
    axiom output in verification.md are technical checks, not human mathematical,
    attribution, or source-fidelity review.

alignment:
  namespace: "Palomar.HegartyThreeEighths"
  statements:
    - source: >-
        Hegarty 2004, Theorem 3.3: for every one-based N>0,
        pi_g(N)/N >= 3/8
      lean: "Palomar.HegartyThreeEighths.hegarty_three_eighths"
      module: "Palomar.HegartyThreeEighths.Solution"
      status: "proved"
      note: >-
        Naturals are zero-indexed: n ranges over all Nat and N=n+1 is therefore
        always positive. Clearing denominators gives 3*(n+1) <= 8*a(n).

