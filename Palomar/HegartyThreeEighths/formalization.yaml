    - "11B75"

status:
  scope: >-
    The package selects only Hegarty's proved three-eighths lower bound. It does
    not select or prove the open limit conjecture a(n)/(n+1) -> 1. Challenge and
    Solution both define reversed prefixes, exact admissibility, the least next
    term, and the zero-indexed sequence independently of the project source.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.HegartyThreeEighths.hegarty_three_eighths"
      file: "Palomar/HegartyThreeEighths/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/HegartyThreeEighths/comparator.json"
      literature_dependencies:
        - "Hegarty 2004, Theorem 3.3"
      note: >-
        A fresh Lean axiom audit shows no dependency on sorryAx. The imported
        HegartyPermutation archive contains the separate intended sorry theorem
        A094870.conj_3_2 for the open limit conjecture, but that theorem is not in
        the selected result's dependency closure.

automation:
  methods:
