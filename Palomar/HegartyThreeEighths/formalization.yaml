version: "v0.4"

project:
  name: "Hegarty's three-eighths bound for the greedy AP-avoiding permutation"
  description: >-
    A Lean 4 formalization of Peter Hegarty's lower bound for the greedy
    arithmetic-pattern-avoiding permutation: in zero-based indexing,
    3*(n+1) <= 8*a(n). The challenge independently defines the ordinary greedy
    construction by positivity, non-reuse, exact three-term arithmetic-progression
    exclusion, and least admissible selection.
  # Required human identities have not been established. These empty lists expose
  # the metadata blocker rather than inventing an author or maintainer.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "Permutations Avoiding Arithmetic Patterns"
    authors:
      - "Peter Hegarty"
    id: "https://doi.org/10.37236/1792"
    type: "paper"
    location: "The Electronic Journal of Combinatorics 11 (2004), R39, Theorem 3.3"
    relationship: "formalizes"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The result is Hegarty's published Theorem 3.3. Repository notes report a
      parity-word typo in the counting argument after equation (6): the relevant
      excluded values must have parity opposite to n. The formal proof uses that
      corrected reading. The referenced extracted paper text is absent from this
      workspace, so the page-level comparison and correction attribution are
      inherited repository evidence, not a new human-checked source audit.
  - title: "OEIS A094870"
    authors:
      - "The OEIS Foundation Inc. and contributors"
    id: "https://oeis.org/A094870"
    type: "web"
    location: "sequence definition, terms, indexing, and Hegarty attribution"
    relationship: "documents"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The repository source records a dated OEIS transcription. No broad or fresh
      literature sweep was undertaken for this package.

related_formalizations: []

classification:
  arxiv:
    - "math.CO"
  msc2020:
