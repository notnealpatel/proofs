      models:
        - "model identifier not exposed by the Yah runtime"
      framework: "Yah"
      tool_setup: >-
        Autonomous AI-assisted package construction, independent greedy-definition
        alignment, targeted Lean compilation, and declaration-level axiom auditing.
        The existing substantive Proofs development is disclosed by the repository
        as at least partly or wholly AI-assisted; its exact prior model and session
