fidelity:
  divergences: >-
    The selected criterion is more general than the classical base-two
    Sierpiński and Riesel instances: b is arbitrary, A and B are integers, and
    n ranges over all naturals. It proves listed divisibility, not composite
    values without further hypotheses. The companion theorem therefore
    requires a natural value N and an explicit listed-divisor bound p <= M < N.
    In particular, nothing silently asserts the false n=0 compositeness claim
    for 4*14^n+1; at n=0 the value and listed divisor can both be 5. No novelty
    or first-formalization claim is made.

