version: "v0.4"

project:
  name: "Arbitrary-base fixed-divisor covering criterion"
  description: >-
    A reusable Lean 4 criterion for integer affine-exponential families
    A*b^n+B at an arbitrary natural base. A finite certificate consists of
    literal triples (a,d,p) whose exponent classes cover the integers, with
    b^d congruent to one modulo p and p dividing A*b^a+B. The headline proves
    that every family value has a listed divisor; a companion non-primality
    theorem makes the proper-divisor bound explicit.
  # Required human identities have not been established. Empty lists expose
  # the submission blocker rather than inventing attribution.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "Verifying Sierpiński and Riesel Numbers in ACL2"
    authors:
      - "John R. Cowles"
      - "Ruben Gamboa"
    id: "https://arxiv.org/abs/1110.4671"
    type: "paper"
    location: "EPTCS 70 (2011), 31–39"
    relationship: "documents"
    license: "CC BY-NC-ND 3.0"
    author_endorsement: "not-contacted"
    note: >-
      This is prior machine-checked work for the concrete base-two numbers
      78557 and 509203. It is cited for Sierpiński/Riesel context and prior
      formalization, not as a source of or priority claim for the selected
      arbitrary-base Lean theorem.

related_formalizations: []

