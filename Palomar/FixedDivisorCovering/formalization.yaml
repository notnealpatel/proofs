alignment:
  namespace: "Palomar.FixedDivisorCovering"
  statements:
    - source: >-
        Finite fixed-divisor covering criterion for A*b^n+B: covering exponent
        classes and compatible per-class divisors give a listed divisor of
        every family value.
      lean: "Palomar.FixedDivisorCovering.IsFixedDivisorSystemBase.exists_mem_fixedDivisors_dvd"
      module: "Palomar.FixedDivisorCovering.Solution"
      status: "proved"
      note: >-
        Coverage is over integer residue classes; exponents in the conclusion
        are natural. Congruences use Nat.ModEq for b^d and Int.ModEq for the
        integer family.
    - source: >-
        A nontrivial listed divisor strictly below a natural family value
        witnesses non-primality.
      lean: "Palomar.FixedDivisorCovering.IsFixedDivisorSystemBase.not_prime"
      module: "Palomar.FixedDivisorCovering.Solution"
      status: "proved"
      note: "The theorem exposes the sufficient inequalities as p <= M < N."

