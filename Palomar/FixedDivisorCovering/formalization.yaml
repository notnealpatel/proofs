status:
  scope: >-
    Challenge and Solution independently define the projections of a finite
    set of natural triples, integer residue-class coverage, and the four-field
    arbitrary-base certificate. The selected headline is the fixed-divisor
    existence theorem for every n : Nat. The only companion selected theorem
    is the non-primality corollary with explicit p <= M < N control. The
    package does not select the base-two transports, progression results, or
    the concrete 78557 and 509203 applications from the source development.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.FixedDivisorCovering.IsFixedDivisorSystemBase.exists_mem_fixedDivisors_dvd"
      file: "Palomar/FixedDivisorCovering/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/FixedDivisorCovering/comparator.json"
      literature_dependencies: []
      note: >-
        For arbitrary b : Nat, A B : Int, literal finite triples T, and every
        n : Nat, a valid certificate supplies p in fixedDivisors T with
        (p : Int) dividing A*(b : Int)^n+B.
    - declaration: "Palomar.FixedDivisorCovering.IsFixedDivisorSystemBase.not_prime"
      file: "Palomar/FixedDivisorCovering/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/FixedDivisorCovering/comparator.json"
      literature_dependencies: []
      note: >-
        If every listed p is at most M, the natural family value is N, and
        M < N, then N is not prime. The strict upper bound is load-bearing;
        divisibility alone allows p=N.

