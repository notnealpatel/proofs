version: "v0.4"

project:
  name: "Shortest addition chains as restricted fresh-target monomial shear programs"
  description: >-
    A Lean 4 formalization that the minimum number of restricted, source-indexed
    fresh-target monomial shears computing exponent n from one exponent-1
    register equals the ordinary shortest addition-chain length l(n), for n
    nonzero. Programs retain all older registers and store exponent traces
    newest first.
  # Required human identities remain unknown. Empty lists expose the blocker
  # rather than inventing a human author or maintainer.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "A003313: Length of shortest addition chain for n"
    authors:
      - "OEIS Foundation Inc."
    id: "https://oeis.org/A003313"
    type: "database-entry"
    location: "OEIS A003313; definition and initial values"
    relationship: "background-definition"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The established addition-chain function is the mathematical background.
      This source does not state the package's restricted monomial-shear model
      correspondence.
  - title: "The Art of Computer Programming, Volume 2: Seminumerical Algorithms"
    authors:
      - "Donald E. Knuth"
    id: "ISBN 978-0-201-89684-8"
    type: "book"
    location: "Section 4.6.3, addition chains"
    relationship: "background-definition"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      Cited by the repository addition-chain development for the ordinary,
      permissive addition-chain convention. No claim is made that the Lean
      proof reproduces a particular proof from this book.

