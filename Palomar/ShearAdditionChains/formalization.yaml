status:
  scope: >-
    The package selects one headline theorem. Challenge.lean independently
    defines ordinary newest-first addition chains, their step-count infimum,
    proof-relevant source-indexed fresh-target monomial programs, actual
    program computations, and their shear-count infimum. Solution.lean repeats
    those declarations without importing Challenge and gives explicit
    trace-preserving, cost-preserving translations to the substantive source
    model in Proofs/ShearEC/ShearAdditionChain.lean. The similarly named plural
    source file is scaffolding and is not theorem evidence.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.ShearAdditionChains.minimumMonomialShears_eq_l"
      file: "Palomar/ShearAdditionChains/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/ShearAdditionChains/comparator.json"
      literature_dependencies:
        - "OEIS A003313"
        - "Knuth, TAOCP Volume 2, Section 4.6.3"
      note: >-
        The one package sorry is the intentional Challenge theorem hole. The
        proved Solution theorem and the imported source theorem have fresh
        axiom audits with no sorryAx.

