fidelity:
  divergences: >-
    The theorem concerns only the declared restricted model: one initial
    register with exponent 1; each counted constructor chooses two existing
    source indices; it allocates a new target with exponent equal to their sum;
    and it retains all older registers as permitted garbage. There is no free
    affine mixing and no scratch cleanup. At n = 0 both indexed types are empty
    and both Nat infima equal the junk convention 0, so the headline explicitly
    assumes n != 0. The result does not assert optimality for unrestricted
    ShearCircuit circuits, reversible arithmetic, elliptic-curve point
    addition, or inversion. Established addition-chain mathematics is used;
    novelty, priority, and existence of earlier formalizations of this exact
    model correspondence are unestablished.

