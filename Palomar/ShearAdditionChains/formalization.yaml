alignment:
  namespace: "Palomar.ShearAdditionChains"
  statements:
    - source: >-
        Proofs/ShearEC/ShearAdditionChain.lean theorem
        ShearEC.ShearAdditionChain.minimumMonomialShears_eq_l, supported by
        NumberComplexity.l from Proofs/NumberComplexity/AdditionChain.lean
      lean: "Palomar.ShearAdditionChains.minimumMonomialShears_eq_l"
      module: "Palomar.ShearAdditionChains.Solution"
      status: "proved"
      note: >-
        Solution defines separate inductives and minima. isAddChain_iff_source
        identifies chain traces; MonomialShearProgram.toSource and ofSource
        transport source indices; shearCount_toSource and shearCount_ofSource
        preserve costs; minimumMonomialShears_eq_source and l_eq_source_l
        transport the two minima before applying the substantive source theorem.

