status:
  scope: >-
    The package inventory consists of Challenge.lean, Solution.lean,
    comparator.json, formalization.yaml, and verification.md. The selected
    declaration is only the equality complexity(3^b)=3*b for natural b with
    1<=b. Both Lean modules define their own Expr with constructors one/add/mul,
    recursive eval and cost, and complexity as the natural infimum over all
    expressions of the requested value. Solution imports the repository's
    DoublingConjecture module and transports the independent minimization
    through explicit expression translations. It neither selects nor claims the
    unrelated open powers-of-two conjecture in that imported module.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.IntegerComplexityPowersOfThree.complexity_three_pow"
      file: "Palomar/IntegerComplexityPowersOfThree/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/IntegerComplexityPowersOfThree/comparator.json"
      literature_dependencies:
        - "Iraids et al., arXiv:1203.6462, Theorem cbounds2"
        - "Selfridge lower bound, as attributed in the repository sources"
      note: >-
        The sole package sorry is the intentional Challenge theorem hole. Fresh
        axiom output shows the selected Solution theorem has no sorryAx
        dependency, while the separately printed powers-of-two conjecture does.

  # Versions are pinned by lean-toolchain and lake-manifest.json and are repeated
  # here to make the source relationship auditable without implying submission.
  toolchain: "Lean 4.33.0-rc1 (commit 62eed1db4d67327ec8120be05f1a1b0847d74561)"
  mathlib_revision: "3edb3c0658f69f197b1e501b1f7623f3f7b3898c"

