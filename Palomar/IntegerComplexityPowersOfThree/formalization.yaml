fidelity:
  divergences: >-
    The formal statement is the positive-exponent consequence stated in the
    repository's quoted Theorem cbounds2. It does not formalize the theorem's
    converse characterization or the parenthetical comparison with every other
    representation. The independent syntax is intentionally isomorphic rather
    than definitionally equal to NumberComplexity.Expr; Solution proves that
    both translations preserve eval and cost and then proves equality of the two
    infimum definitions on positive inputs. The exponent guard excludes b=0,
    where complexity(1)=1 but 3*0=0. The imported source file also contains an
    intended open powers-of-two sorry, which is outside the selected axiom
    closure.

