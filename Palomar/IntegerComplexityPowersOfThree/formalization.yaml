version: "v0.4"

project:
  name: "Integer complexity of positive powers of three"
  description: >-
    A Lean 4 formalization of the classical exact value of Mahler–Popken
    integer complexity on positive powers of three: the least number of ones
    needed to construct 3^b using addition and multiplication is 3*b. The
    Challenge and Solution independently define the literal expression syntax,
    evaluator, leaf cost, and infimum-based complexity.
  # Required human identities are unknown. Empty lists expose the blocker
  # instead of inventing a formalization author or responsible maintainer.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "Integer complexity: experimental and analytical results"
    authors:
      - "Juris Iraids"
      - "Kārlis Balodis"
      - "Jānis Čerņenoks"
      - "Māris Opmanis"
      - "Rihards Opmanis"
      - "Kārlis Podnieks"
    id: "https://arxiv.org/abs/1203.6462"
    type: "paper"
    location: "Theorem cbounds2; in particular, the equality for every b >= 1"
    relationship: "formalizes"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The repository source quotes this theorem and proves its positive-power
      equality. This package selects only that equality, not the paper's iff or
      shortest-representation parenthetical clauses. No new-theorem or priority
      claim is made, and no fresh human source comparison was performed.
  - title: "OEIS A005245 — Mahler–Popken complexity"
    authors:
      - "The OEIS Foundation Inc. and contributors"
    id: "https://oeis.org/A005245"
    type: "website"
    location: "sequence definition and classical lower-bound attribution"
    relationship: "documents"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The definition and attribution are inherited from the repository source
      and candidate README; this packaging task did not undertake a broad
      literature search.
  - title: "Numbers with integer complexity close to the lower bound"
    authors:
      - "Harry Altman"
      - "Joshua Zelinsky"
    id: "https://arxiv.org/abs/1207.4841"
    type: "paper"
    location: "Abstract; credits John Selfridge with complexity(n) >= 3 log_3 n"
    relationship: "supports-proof-attribution"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      This supports the inherited attribution of the cube lower bound used by
      the repository proof. The package does not claim to reproduce a published
      proof line by line.

related_formalizations: []

classification:
