  status: "unchecked"
  reviewers: []
  notes: >-
    USER review is the sole review stage and remains pending. Lean elaboration,
    signature output, source scans, and axiom auditing in verification.md are
    mechanical evidence, not human mathematical, attribution, or source-fidelity
    review.

alignment:
  namespace: "Palomar.IntegerComplexityPowersOfThree"
  statements:
    - source: >-
        For every integer b >= 1, the Mahler–Popken integer complexity of 3^b
        equals 3b.
      lean: "Palomar.IntegerComplexityPowersOfThree.complexity_three_pow"
      module: "Palomar.IntegerComplexityPowersOfThree.Solution"
      status: "proved"
      note: >-
        The Lean theorem quantifies b : Nat, assumes 1 <= b, and concludes that
        the independently defined complexity of 3^b is 3*b.

