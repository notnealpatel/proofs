status:
  scope: >-
    Challenge and Solution independently expose the full finite uniform,
    intersecting, no-small-cover predicate, all attainable edge counts over
    every finite labelled ground type Fin N, and their natural infimum. The
    sole selected result is the unconditional full equality at r=4. The
    lower helper is universal over arbitrary ground types and does not assume
    a bounded vertex set, an enumeration of families, or a classification.
    The v0.4 selected/package-proof sorry count is zero: it excludes the one
    deliberate Comparator placeholder in Challenge and the six unrelated
    imported archive sorries, none of which belongs to the selected proof
    closure.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.ErdosLovaszFour.tripathi_erdosLovaszNum_four"
      file: "Palomar/ErdosLovaszFour/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/ErdosLovaszFour/comparator.json"
      literature_dependencies: []
      note: >-
        The Solution proves predicate, attainable-count-set, and invariant
        alignment before applying the proved source theorem. Six unrelated
        archived literature declarations imported with the source module
        still contain sorry, but none occurs in the selected dependency
        closure or in the audited upper/lower bridges.

