    the freshly compiled source parent olean with verified hash and standard
    axiom closure, successful fresh package compilation, source inspection, and
    smaller re-reduced checks. review.status remains unchecked because it
    records the absence of human review; neither AI review is human approval.
    USER maintainer/approval and registration decisions remain pending. No
    author endorsement has been sought.

