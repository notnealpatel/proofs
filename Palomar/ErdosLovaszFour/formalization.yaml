version: "v0.4"

project:
  name: "The exact Erdős–Lovász value g(4) = 9"
  description: >-
    A Lean 4 package for the Erdős–Lovász minimum-edge-count invariant,
    proving the exact value g(4) = 9 from Tripathi's nine-edge witness and
    a universal lower bound for every admissible four-uniform family.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "A result on intersecting families with maximum transversal size"
    authors:
      - "Amit Tripathi"
    id: "https://arxiv.org/abs/1409.4610"
    type: "paper"
    location: "2014 preprint, Theorem q(4)=9 and subsection An Example"
    relationship: "formalizes"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The canonical arXiv TeX was retrieved and read during this packaging
      task. It proves q(4)=9 by degree reduction and supplies the nine-block
      example. The Lean upper bound transcribes that example with labels
      shifted from 1,...,11 to 0,...,10. The Lean lower proof follows the
      degree-reduction strategy but replaces the five-edge classification
      and final global pair count with direct finite incidence arguments.

related_formalizations:
  - title: "Erdős–Lovász: the upper bound g(4) ≤ 9"
    id: "Palomar/ErdosLovaszFourUpper"
    type: "formalization"
    relationship: "supersedes"
    note: >-
      An earlier candidate in the same repository selects only g(4) <= 9.
      It is not imported or modified by this full-equality package.

classification:
  arxiv:
