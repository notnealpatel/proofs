fidelity:
  divergences: >-
    The formal count is the literal number of nonempty subsets S of
    Finset.Icc 1 n satisfying S.card | S.sum id. At n = 0 the asymptotic
    expressions use explicit branches solely to avoid divisions by zero; this
    changes only one value and not the atTop result. The arbitrary-order
    theorem uses an external error scale o(2^n/n^(M+1)), equivalently
    o(1/n^M) after division by the leading prefactor 2^(n+1)/n. This agrees
    with the explicit order-five OEIS formula but does not assert the
    potentially stronger off-by-one reading of the general OEIS punctuation.
    The fixed-order statement matches the prior AlphaProof Nexus target form,
    while the arbitrary-M result is the broader theorem proved here.

