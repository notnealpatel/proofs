version: "v0.4"

project:
  name: "A051293 integer-mean subset asymptotics"
  description: >-
    A Lean 4 formalization of the arbitrary-order asymptotic expansion for the
    number of nonempty subsets of {1, ..., n} whose arithmetic mean is an
    integer. The coefficients are the Fubini (ordered Bell) numbers. The
    package also states their first six values and the explicit order-five
    normalized limit.
  # Required human identities are unknown. Empty lists expose the metadata
  # blocker rather than inventing a formalization author or maintainer.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "OEIS A051293 — subsets with integer arithmetic mean"
    authors:
      - "The OEIS Foundation Inc. and contributors to entry A051293"
    id: "https://oeis.org/A051293"
    type: "database-entry"
    location: >-
      Sequence definition and Benoit Cloitre comments of October 2002 giving
      the general Fubini-coefficient expansion and the explicit order-five form
    relationship: "formalizes"
    license: "OEIS End-User License Agreement"
    author_endorsement: "not-contacted"
    note: >-
      The package proves the literal subset-count expansion. It follows the
      error convention fixed unambiguously by Cloitre's explicit six-term
      formula; the general OEIS sentence is punctuated in a way that admits a
      stronger, off-by-one reading which is not claimed here.
  - title: "OEIS A000670 — Fubini numbers"
    authors:
      - "The OEIS Foundation Inc. and contributors to entry A000670"
    id: "https://oeis.org/A000670"
    type: "database-entry"
    location: "Ordered Bell (preferential-arrangement) numbers"
    relationship: "background"
    license: "OEIS End-User License Agreement"
    author_endorsement: "not-contacted"
    note: >-
      These are the coefficients 1, 1, 3, 13, 75, 541, ... in the expansion.
      Challenge and Solution define them independently by their binomial
      recurrence.

related_formalizations:
  - title: "Advancing Mathematics Research with AI-Driven Formal Proof Search"
    id: "https://arxiv.org/abs/2605.22763"
    type: "formalization account"
    relationship: "prior-related-formalization"
    note: >-
      The cited AlphaProof Nexus account formalizes the fixed order-five
      normalized-limit target. This package additionally formalizes the
      arbitrary-order expansion and derives the fixed-order statement through
      the repository's Cloitre bridge. No priority or first-formalization claim
      is made for either development.

