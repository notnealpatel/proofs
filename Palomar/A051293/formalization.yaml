    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "PalomarA051293.fubiniCoefficient_first_six"
      file: "Palomar/A051293/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/A051293/comparator.json"
      literature_dependencies: []
      note: >-
        The recurrence-defined coefficients at indices zero through five are
        exactly 1, 1, 3, 13, 75, and 541.
    - declaration: "PalomarA051293.arbitrary_order_asymptotic"
      file: "Palomar/A051293/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/A051293/comparator.json"
      literature_dependencies: []
      note: >-
        For every natural M, the error after retaining coefficients through M
        is little-o of 2^n / n^(M+1). The if-branches only totalize n = 0.
    - declaration: "PalomarA051293.fixed_order_five"
      file: "Palomar/A051293/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/A051293/comparator.json"
      literature_dependencies: []
      note: >-
        The error after the six displayed coefficients, divided by
        2^(n+1)/n^6, tends to zero. The Solution derives this from the general
        theorem through the repository's proved Cloitre bridge.

