version: "v0.4"

project:
  name: "Power-of-two ternary digit counting bound"
  description: >-
    A Lean 4 formalization of the exponent-count upper bound for powers of two
    whose ternary digits are all zero or one. For every natural N with 1 ≤ N,
    the real cardinality of such exponents n < N is at most
    2 * N^(log base 3 of 2). The package also proves that the finite sieve at
    depth j + 1 has exactly 2^j surviving exponent residue classes modulo
    2 * 3^j. It does not prove finiteness of the Erdős 406 set.
  # Required human identities are unknown. Empty lists expose the blocker
  # rather than fabricating a human author or responsible maintainer.
  authors: []
  responsible_maintainers: []
  license: "MIT"

sources:
  - title: "Ternary expansions of powers of 2"
    authors:
      - "Jeffrey C. Lagarias"
    id: "https://arxiv.org/abs/math/0512006"
    type: "paper"
    location: >-
      Journal of the London Mathematical Society (2) 79 (2009), 562–588;
      Theorem 1.4 specialized to lambda = 1
    relationship: "formalizes-result"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The formal headline uses the same constant 2 and exponent log base 3 of
      2. The Lean boundary convention counts n < N for natural N with 1 ≤ N,
      rather than the paper's n ≤ X real-window notation.
  - title: "A note on a paper of H. Gupta concerning powers of two and three"
    authors:
      - "Władysław Narkiewicz"
    id: ""
    type: "paper"
    location: >-
      Univ. Beograd. Publ. Elektrotehn. Fak. Ser. Mat. Fiz. (1980), 173–174
    relationship: "historical-prior-bound"
    license: ""
    author_endorsement: "not-contacted"
    note: >-
      The parent source records Narkiewicz's stronger constant 1.62. That
      stronger constant is not formalized by this package.

related_formalizations: []

