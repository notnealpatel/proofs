        2 and exponent log base 3 of 2 for exponents whose power-of-two value
        omits ternary digit 2
      lean: "Palomar.PowerOfTwoDigitCounts.card_erdos406_filter_le_rpow"
      module: "Palomar.PowerOfTwoDigitCounts.Solution"
      status: "proved"
      note: >-
        The Lean theorem explicitly requires 1 ≤ N and counts exponents n < N.
    - source: >-
        Finite-depth exponent sieve: exactly 2^j admissible classes modulo
        2 * 3^j survive the lowest j + 1 digit conditions
      lean: "Palomar.PowerOfTwoDigitCounts.card_sieveClasses"
      module: "Palomar.PowerOfTwoDigitCounts.Solution"
      status: "proved"
      note: >-
        This bounded natural statement accompanies, but does not replace, the
