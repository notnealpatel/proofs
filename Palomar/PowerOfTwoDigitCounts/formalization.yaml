status:
  scope: >-
    Challenge and Solution independently define the literal Nat.digits 3
    predicate, the n < N exponent count, the bounded low-digit sieve, and its
    exponent residue classes. The Solution bridges definitionally to
    Proofs/Enumerative/PowerOfTwoDigitsCount.lean. The headline remains the
    actual exponent-count upper bound; the exact survivor-class cardinality is
    included as a supporting selected theorem.
  sorry_count: 2
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Palomar.PowerOfTwoDigitCounts.card_erdos406_filter_le_rpow"
      file: "Palomar/PowerOfTwoDigitCounts/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/PowerOfTwoDigitCounts/comparator.json"
      literature_dependencies:
        - "Lagarias 2009, Theorem 1.4 at lambda = 1"
      note: >-
        For 1 ≤ N, this bounds the real cast of the number of exponents n < N
        for which every ternary digit of the value 2^n is at most one by
        2 * N^(Real.logb 3 2).
    - declaration: "Palomar.PowerOfTwoDigitCounts.card_sieveClasses"
      file: "Palomar/PowerOfTwoDigitCounts/Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "Palomar/PowerOfTwoDigitCounts/comparator.json"
      literature_dependencies: []
      note: >-
        Exactly 2^j exponent classes in range (2 * 3^j) pass the lowest j + 1
        ternary-digit tests.

