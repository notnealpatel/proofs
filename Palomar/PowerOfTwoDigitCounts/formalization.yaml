fidelity:
  divergences: >-
    The formal statement uses a natural-number range and counts n < N, while
    Lagarias Theorem 1.4 is stated with n ≤ X for real X ≥ 2. The constant 2
    and exponent log base 3 of 2 agree. The exact survivor-class theorem is a
    finite exponent-side sieve statement at digit depth j + 1 and modulus
    2 * 3^j; it is not a claim that every zero-one ternary string is attained.
    Narkiewicz's sharper constant 1.62 is not formalized.

